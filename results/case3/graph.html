        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "yellow", "id": "START", "label": "START", "shape": "square", "size": 20}, {"color": "blue", "id": "043b89a1-38a6-4ede-93a5-4c5c2be4b9b4", "label": "m1", "shape": "circle", "size": 30, "title": "STEP 1"}, {"color": "red", "id": "32cf12bc-5620-4245-9ff9-3646a5348be9", "label": "a1", "shape": "square", "size": 10, "title": "Command and Scripting Interpreter: Python as used by the malware"}, {"color": "blue", "id": "e2d8bcad-cf30-4e22-b53f-d61f4a99e49b", "label": "m2", "shape": "circle", "size": 30, "title": "STEP 2"}, {"color": "red", "id": "ed26aae6-0b17-4cc3-b733-6979b3c230a6", "label": "a2", "shape": "square", "size": 10, "title": "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder as used by the malware"}, {"color": "blue", "id": "831b637b-6b8a-4b0f-ab24-dfad16231aca", "label": "m3", "shape": "circle", "size": 30, "title": "STEP 3"}, {"color": "red", "id": "54f7f192-0bb8-4911-b51e-3d482ed6b6d4", "label": "a3", "shape": "square", "size": 10, "title": "Obfuscated Files or Information as used by the malware"}, {"color": "red", "id": "09a301af-bf71-48f3-9815-4a65fe528234", "label": "a4", "shape": "square", "size": 10, "title": "Execution Guardrails as used by the malware"}, {"color": "red", "id": "a003e003-be99-40ab-95f4-d646804e26b1", "label": "a5", "shape": "square", "size": 10, "title": "Masquerading: Match Legitimate Name or Location as used by the malware"}, {"color": "blue", "id": "79b7bc59-c4d3-48d1-accb-bb85ae815b06", "label": "m4", "shape": "circle", "size": 30, "title": "STEP 4"}, {"color": "red", "id": "3b979581-6cbc-42ef-b38c-8229b9baf607", "label": "a6", "shape": "square", "size": 10, "title": "Application Layer Protocol: Web Protocols as used by the malware"}, {"color": "red", "id": "2a1d9bac-8557-49ff-86a3-d4f1e61d4089", "label": "a7", "shape": "square", "size": 10, "title": "Data Encoding: Non-Standard Encoding as used by the malware"}, {"color": "yellow", "id": "END", "label": "END", "shape": "square", "size": 20}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "black", "from": "START", "to": "043b89a1-38a6-4ede-93a5-4c5c2be4b9b4"}, {"arrows": "to", "color": "black", "from": "043b89a1-38a6-4ede-93a5-4c5c2be4b9b4", "to": "32cf12bc-5620-4245-9ff9-3646a5348be9"}, {"arrows": "to", "color": "black", "from": "32cf12bc-5620-4245-9ff9-3646a5348be9", "to": "e2d8bcad-cf30-4e22-b53f-d61f4a99e49b"}, {"arrows": "to", "color": "black", "from": "e2d8bcad-cf30-4e22-b53f-d61f4a99e49b", "to": "ed26aae6-0b17-4cc3-b733-6979b3c230a6"}, {"arrows": "to", "color": "black", "from": "ed26aae6-0b17-4cc3-b733-6979b3c230a6", "to": "831b637b-6b8a-4b0f-ab24-dfad16231aca"}, {"arrows": "to", "color": "black", "from": "831b637b-6b8a-4b0f-ab24-dfad16231aca", "to": "54f7f192-0bb8-4911-b51e-3d482ed6b6d4"}, {"arrows": "to", "color": "black", "from": "831b637b-6b8a-4b0f-ab24-dfad16231aca", "to": "09a301af-bf71-48f3-9815-4a65fe528234"}, {"arrows": "to", "color": "black", "from": "831b637b-6b8a-4b0f-ab24-dfad16231aca", "to": "a003e003-be99-40ab-95f4-d646804e26b1"}, {"arrows": "to", "color": "black", "from": "54f7f192-0bb8-4911-b51e-3d482ed6b6d4", "to": "79b7bc59-c4d3-48d1-accb-bb85ae815b06"}, {"arrows": "to", "color": "black", "from": "09a301af-bf71-48f3-9815-4a65fe528234", "to": "79b7bc59-c4d3-48d1-accb-bb85ae815b06"}, {"arrows": "to", "color": "black", "from": "a003e003-be99-40ab-95f4-d646804e26b1", "to": "79b7bc59-c4d3-48d1-accb-bb85ae815b06"}, {"arrows": "to", "color": "black", "from": "79b7bc59-c4d3-48d1-accb-bb85ae815b06", "to": "3b979581-6cbc-42ef-b38c-8229b9baf607"}, {"arrows": "to", "color": "black", "from": "79b7bc59-c4d3-48d1-accb-bb85ae815b06", "to": "2a1d9bac-8557-49ff-86a3-d4f1e61d4089"}, {"arrows": "to", "color": "black", "from": "3b979581-6cbc-42ef-b38c-8229b9baf607", "to": "END"}, {"arrows": "to", "color": "black", "from": "2a1d9bac-8557-49ff-86a3-d4f1e61d4089", "to": "END"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
